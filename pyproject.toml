[project]
name = "vault"
version = "0.1.0"
description = "Catalog-scale archive delivery triage — machine-measured, not estimated"
requires-python = ">=3.13"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.14.3",
    "clickhouse-connect>=1.8.0",
    "fastapi[standard]>=0.141.1",
    "google-genai>=2.22.0",
    "mcp>=2.2.0",
    "mcp-clickhouse>=0.6.0",
    "uvicorn>=0.52.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
